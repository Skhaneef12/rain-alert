name: tests

# Runs the offline tests (no secrets, no network) on every push and pull request.
# main is protected: changes go through a pull request, and it can only merge when this passes.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r rain-alert/requirements.txt
      - run: python -m unittest discover -s tests -v

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test --test-reporter=spec tests/worker.test.mjs
