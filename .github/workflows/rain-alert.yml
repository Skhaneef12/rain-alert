name: rain-alert

# No schedule here: GitHub's own cron dropped most runs and started others hours late.
# The Cloudflare Worker (worker/wrangler.toml [triggers]) starts this workflow on time instead,
# passing the mode and the time slot it was started for. You can also run it by hand.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which message to run"
        type: choice
        options: [hourly, daily, evening, tomorrow]
        default: hourly
      scheduled_at:
        description: "Time slot (UTC, set by the Worker). Leave empty for a manual run."
        required: false
        default: ""

permissions:
  contents: read

# Never let a late run overlap the next one (both could edit the same pinned status message).
concurrency:
  group: rain-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rain-alert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run rain alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAIN_MM_THRESHOLD: ${{ vars.RAIN_MM_THRESHOLD }}
          RAIN_PROB_THRESHOLD: ${{ vars.RAIN_PROB_THRESHOLD }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
          MODE: ${{ inputs.mode }}
        run: |
          status=0
          case "$MODE" in
            daily)
              python rain_alert.py --daily || status=1 ;;
            evening)  # last warning of the day, then tomorrow's preview
              python rain_alert.py || status=1
              python rain_alert.py --tomorrow || status=1 ;;
            tomorrow)
              python rain_alert.py --tomorrow || status=1 ;;
            *)
              python rain_alert.py || status=1 ;;
          esac
          exit $status
